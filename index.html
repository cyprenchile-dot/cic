<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruleta CIC - 114 Años</title>
    <!-- Librería para el Confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1c2331;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
            touch-action: none;
        }
        
        .header {
            position: absolute;
            top: 4%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
            z-index: 10;
        }
        
        .header h1 {
            font-size: clamp(1.8rem, 5vh, 4rem);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .header p {
            font-size: clamp(1rem, 2.5vh, 1.5rem);
            margin: 5px 0 0 0;
            background-color: #007bb5;
            padding: 5px 20px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-transform: uppercase;
            font-weight: bold;
        }
        
        .wheel-container {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: min(90vw, 70vh); 
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        
        .pointer-container {
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(50px, 8vw, 80px);
            height: clamp(75px, 12vw, 120px);
            z-index: 20;
            filter: drop-shadow(0 6px 6px rgba(0,0,0,0.6));
        }
        
        /* LOGO CENTRAL EN SVG */
        .center-logo {
            position: absolute;
            width: 32%;
            height: 32%;
            border-radius: 50%;
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.1s;
            background-color: white;
        }

        .center-logo:active {
            transform: scale(0.95);
        }
        
        .fullscreen-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
            transition: 0.3s;
        }

        /* MODAL DEL GANADOR */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(28, 35, 49, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            background: white;
            color: #1c2331;
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 80%;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
