<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruleta CIC - 114 Años</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1c2331; /* Fondo corporativo CIC */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden; /* Evita cualquier barra de desplazamiento */
            touch-action: none;
        }
        
        .header {
            position: absolute;
            top: 4%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
            z-index: 10;
        }
        
        .header h1 {
            font-size: clamp(1.8rem, 5vh, 4rem);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .header p {
            font-size: clamp(1rem, 2.5vh, 1.5rem);
            margin: 5px 0 0 0;
            background-color: #007bb5;
            padding: 5px 20px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        /* LA SOLUCIÓN DEFINITIVA */
        .wheel-container {
            position: absolute;
            top: 55%; /* Ligeramente más abajo del centro para dejar espacio al título */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            /* Toma el valor MÁS PEQUEÑO entre el ancho y el alto de la pantalla */
            max-width: min(90vw, 70vh); 
            aspect-ratio: 1 / 1; /* Obliga a que siempre sea un cuadrado perfecto */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        
        .pointer {
            position: absolute;
            top: -5%;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: clamp(15px, 2.5vw, 25px) solid transparent;
            border-right: clamp(15px, 2.5vw, 25px) solid transparent;
            border-top: clamp(35px, 6vw, 55px) solid #ffffff;
            z-index: 20;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4));
        }
        
        .center-logo {
            position: absolute;
            width: 25%;
            height: 25%;
            background-color: white;
            border-radius: 50%;
            z-index: 15;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .center-logo:active {
            transform: scale(0.95);
        }
        
        .center-logo h2 {
            color: #2c3e50;
            margin: 0;
            font-size: clamp(1.2rem, 3.5vw, 2.5rem);
            font-weight: 900;
        }
        
        .center-logo span {
            color: #7f8c8d;
            font-size: clamp(0.7rem, 1.5vw, 1.2rem);
            font-weight: bold;
        }
        
        .fullscreen-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
            transition: 0.3s;
        }

        .fullscreen-btn:hover {
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>¡Gira y Gana!</h1>
        <p>Descubre tu premio</p>
    </div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="800" height="800"></canvas>
        <div class="center-logo" id="spinButton">
            <h2>CIC</h2>
            <span>114 AÑOS</span>
        </div>
    </div>
    
    <button class="fullscreen-btn" onclick="toggleFullScreen()">⛶ Pantalla Completa</button>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinButton = document.getElementById('spinButton');
        
        const prizes = [
            { text: "Siga participando", color: "#4fb2d9", icon: "😔" },
            { text: "Regalo CIC", color: "#324451", icon: "🎁" },
            { text: "Gira de nuevo", color: "#c1c6c8", icon: "🔄" },
            { text: "Siga participando", color: "#4fb2d9", icon: "😔" },
            { text: "Regalo CIC", color: "#324451", icon: "🎁" },
            { text: "Siga participando", color: "#c1c6c8", icon: "😔" }
        ];

        let currentAngle = 0;
        let isSpinning = false;
        let spinVelocity = 0;
        const friction = 0.985;
        
        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;
            const sliceAngle = (2 * Math.PI) / prizes.length;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < prizes.length; i++) {
                const startAngle = currentAngle + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = prizes[i].color;
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = "#ffffff";
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                
                ctx.fillStyle = (prizes[i].color === "#c1c6c8") ? "#2c3e50" : "#ffffff";
                
                ctx.font = "bold 40px Arial";
                ctx.fillText(prizes[i].icon, radius - 40, 15);
                ctx.font = "bold 26px Arial";
                ctx.fillText(prizes[i].text, radius - 100, 10);
                ctx.restore();
            }
        }

        function animate() {
            if (isSpinning) {
                currentAngle += spinVelocity;
                spinVelocity *= friction;

                if (spinVelocity < 0.002) {
                    isSpinning = false;
                    spinVelocity = 0;
                }
                drawWheel();
                requestAnimationFrame(animate);
            }
        }

        spinButton.addEventListener('click', () => {
            if (!isSpinning) {
                spinVelocity = Math.random() * 0.2 + 0.3; 
                isSpinning = true;
                animate();
            }
        });

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        drawWheel();
    </script>
</body>
</html>
