<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons & Confetti (con fallback seguro si no hay internet) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:ital,wght@0,500;0,700;0,800;0,900;1,700;1,800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .cic-serif {
      font-family: 'Cinzel', Georgia, serif;
    }
    .center-pulse {
      transform: translate(-50%, -50%);
    }
    /* Rebote mecánico de la aguja superior */
    @keyframes pinKick {
      0% { transform: translateX(-50%) rotate(0deg); }
      35% { transform: translateX(-50%) rotate(-26deg); }
      75% { transform: translateX(-50%) rotate(6deg); }
      100% { transform: translateX(-50%) rotate(0deg); }
    }
    .indicator-kick {
      animation: pinKick 0.14s ease-out;
    }
    @keyframes shakePower {
      0%, 100% { transform: translate(-50%, -50%) scale(1.06) rotate(0deg); }
      25% { transform: translate(-51%, -49%) scale(1.07) rotate(-1deg); }
      75% { transform: translate(-49%, -51%) scale(1.07) rotate(1deg); }
    }
    .max-power-shake {
      animation: shakePower 0.08s infinite;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-[#1b252b] via-[#243138] to-[#161e23] text-white h-screen w-screen overflow-hidden select-none relative flex flex-col items-center justify-center">

  <script>

    /* =====================================================================

        isWin: true,

      {

        type: 'faces',

        orientation: 'outward',
        isWin: false,
        titleModal: "Siga participando",
        header: "¡Casi!",
        detail: "¡Muchas gracias por visitar CIC!"
      },
      {
        id: 7, // Arriba-Izquierda (315° a 360°)
        type: 'discount',
        bg: "#303d44", // En la imagen, arriba a la izquierda es Gris Carbón con Regalo CIC, y a su izquierda Celeste 5% OFF
        // Ajustamos el orden exacto del círculo en sentido horario comenzando a las 12:00:
        type: 'gift',
        bg: "#303d44",
        orientation: 'inward',
        isWin: true,
        titleModal: "Regalo CIC",
        header: "¡Premio Especial!",
        detail: "¡Ganaste un Regalo Sorpresa CIC!"
      }
    ];

    // Ajuste milimétrico de los 8 gajos leyendo la imagen proporcionada en sentido horario desde las 12 en punto:
    // Las 12:00 en punto es la línea vertical divisoria superior:
    // 1. (0° a 41°): Gris claro (#adb8c6) -> "5% OFF en el total de tu boleta"
    // 2. (41° a 82°): Celeste (#3b96c4) -> "Siga participando"
    // 3. (82° a 126°): Gris oscuro (#303d44) -> "Regalo CIC"
    // 4. (126° a 166°): Gris claro (#adb8c6) -> "Gira de nuevo"
    // 5. (166° a 202°): Celeste (#3b96c4) -> "Siga participando" (abajo al centro)
    // 6. (202° a 242°): Gris oscuro (#303d44) -> "Regalo CIC" (abajo izquierda)
    // 7. (242° a 282°): Gris claro (#adb8c6) -> "Siga participando" (izquierda)
    // 8. (282° a 320°): Celeste (#3b96c4) -> "5% OFF en el total de tu boleta" (arriba izquierda)
    // 9. (320° a 360°): Gris oscuro (#303d44) -> "Regalo CIC" (arriba centro-izquierda)
    // ¡Nota clave! La imagen original tiene exactamente 9 SECTORES (40 grados cada uno = 360°), por eso las 12:00 es una línea recta vertical y abajo a las 6:00 queda el sector celeste centrado.
    const EXACT_9_SECTORS = [
      {
        // Sector 1: Arriba Derecha (0° a 40°)
        type: 'discount',
        bg: "#adb8c6",
        orientation: 'inward',
        isWin: true,
        titleModal: "5% OFF en el total de tu boleta",
        header: "¡Felicidades!",
        detail: "Has ganado un 5% de descuento en el total de tu boleta."
      },
      {
        // Sector 2: Derecha Arriba (40° a 80°)
        type: 'faces',
        bg: "#3b96c4",
        orientation: 'inward',
        isWin: false,
        titleModal: "Siga participando",
        header: "¡Gracias por participar!",
        detail: "Sigue intentándolo en tu próxima visita."
      },
      {
        // Sector 3: Derecha Abajo (80° a 120°)
        type: 'gift',
        bg: "#303d44",
        orientation: 'inward',
        isWin: true,
        titleModal: "Regalo CIC",
        header: "¡Excelente!",
        detail: "¡Ganaste un Regalo exclusivo CIC! Solicítalo a nuestro equipo."
      },
      {
        // Sector 4: Abajo Derecha (120° a 160°)
        type: 'spin_again',
        bg: "#adb8c6",
        orientation: 'outward',
        isWin: false,
        isSpinAgain: true,
        titleModal: "Gira de nuevo",
        header: "¡Otra oportunidad!",
        detail: "¡Tienes un giro adicional gratis!"
      },
      {
        // Sector 5: Abajo Centro (160° a 200°)
        type: 'faces',
        bg: "#3b96c4",
        orientation: 'outward',
        isWin: false,
        titleModal: "Siga participando",
        header: "¡Gracias por participar!",
        detail: "Esperamos que disfrutes tu visita a nuestra tienda CIC."
      },
      {
        // Sector 6: Abajo Izquierda (200° a 240°)
        type: 'gift',
        bg: "#303d44",
        orientation: 'outward',
        isWin: true,
        titleModal: "Regalo CIC",
        header: "¡Felicitaciones!",
        detail: "¡Ganaste un Regalo Sorpresa CIC!"
      },
      {
        // Sector 7: Izquierda (240° a 280°)
        type: 'faces',
        bg: "#adb8c6",
        orientation: 'outward',
        isWin: false,
        titleModal: "Siga participando",
        header: "¡Casi!",
        detail: "¡Sigue participando con CIC!"
      },
      {
        // Sector 8: Arriba Izquierda (280° a 320°)
        type: 'discount',
        bg: "#3b96c4",
        orientation: 'inward',
        isWin: true,
        titleModal: "5% OFF en el total de tu boleta",
        header: "¡Premio Especial!",
        detail: "Aplica tu 5% OFF en el total de tu boleta al pagar."
      },
      {
        // Sector 9: Arriba Centro-Izquierda (320° a 360°)
        type: 'gift',
        bg: "#303d44",
        orientation: 'inward',
        isWin: true,
        titleModal: "Regalo CIC",
        header: "¡Felicitaciones!",
        detail: "¡Te llevas un Regalo exclusivo CIC!"
      }
    ];

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const NUM_SECTORS = EXACT_9_SECTORS.length; // 9 sectores exactos como en la imagen
    const ARC_ANGLE = (2 * Math.PI) / NUM_SECTORS;

    let currentRotation = 0; // A las 0 rad, la división entre el sector 9 y el sector 1 queda exactamente a las 12:00
    let angularVelocity = 0;
    const friction = 0.989;
    let isSpinning = false;
    
    // Variables para Arrastre (Swipe)
    let isDragging = false;
    let dragStartAngle = 0;
    let lastDragAngle = 0;

    // Variables para Carga (Hold to Charge) con medidor visual y sonoro
    let isCharging = false;
    let chargeStartTime = 0;
    let lastChargeStepSound = -1;
    const maxChargeDuration = 2000; // 2 segundos para llegar al 100% de intensidad

    let soundEnabled = true;
    let lastSectorIndex = -1;

    // =====================================================================
    // SÍNTESIS DE SONIDO PURA (INCLUYE SONIDO DE CARGA DE INTENSIDAD)
    // =====================================================================
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playChargePulseSound(powerRatio) {
      if (!soundEnabled) return;
      const ctxAudio = getAudioContext();
      if (!ctxAudio) return;

      const osc = ctxAudio.createOscillator();
      const gain = ctxAudio.createGain();
      osc.type = 'sine';
      const now = ctxAudio.currentTime;
      // Frecuencia sube de 220Hz a 880Hz según la intensidad cargada
      const freq = 220 + (powerRatio * 660);
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.12, now + 0.06);

      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);

      osc.connect(gain);
      gain.connect(ctxAudio.destination);
      osc.start(now);
      osc.stop(now + 0.07);
    }

    function playTickSound() {
      if (!soundEnabled) return;
      const ctxAudio = getAudioContext();
      if (!ctxAudio) return;

      const osc = ctxAudio.createOscillator();
      const gain = ctxAudio.createGain();
      osc.type = 'triangle';
      const now = ctxAudio.currentTime;
      osc.frequency.setValueAtTime(700, now);
      osc.frequency.exponentialRampToValueAtTime(130, now + 0.035);

      gain.gain.setValueAtTime(0.32, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);

      osc.connect(gain);
      gain.connect(ctxAudio.destination);
      osc.start(now);
      osc.stop(now + 0.04);
    }

    function playWinSound() {
      if (!soundEnabled) return;
      const ctxAudio = getAudioContext();
      if (!ctxAudio) return;

      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = ctxAudio.createOscillator();
        const gain = ctxAudio.createGain();
        osc.type = 'triangle';
        const startTime = ctxAudio.currentTime + idx * 0.11;
        osc.frequency.setValueAtTime(freq, startTime);

        gain.gain.setValueAtTime(0.26, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.45);

        osc.connect(gain);
        gain.connect(ctxAudio.destination);
        osc.start(startTime);
        osc.stop(startTime + 0.46);
      });
    }

    function playNeutralSound() {
      if (!soundEnabled) return;
      const ctxAudio = getAudioContext();
      if (!ctxAudio) return;

      const notes = [440, 392];
      notes.forEach((freq, idx) => {
        const osc = ctxAudio.createOscillator();
        const gain = ctxAudio.createGain();
        osc.type = 'sine';
        const startTime = ctxAudio.currentTime + idx * 0.16;
        osc.frequency.setValueAtTime(freq, startTime);

        gain.gain.setValueAtTime(0.2, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);

        osc.connect(gain);
        gain.connect(ctxAudio.destination);
        osc.start(startTime);
        osc.stop(startTime + 0.32);
      });
    }

    // =====================================================================
    // DIBUJO VECTORIAL IDÉNTICO A LA GRÁFICA DE CIC (BLANCO PURO)
    // =====================================================================
    function drawGiftBagGraphic(c, yOffset) {
      c.save();
      c.translate(0, yOffset);
      c.strokeStyle = '#ffffff';
      c.fillStyle = '#ffffff';
      c.lineWidth = 4.2;
      c.lineCap = 'round';
      c.lineJoin = 'round';

      // Bolsa trapecio (izquierda)
      c.beginPath();
      c.moveTo(-48, -22);
      c.lineTo(-4, -22);
      c.lineTo(0, 26);
      c.lineTo(-52, 26);
      c.closePath();
      c.stroke();

      // Asa superior de la bolsa
      c.beginPath();
      c.arc(-26, -22, 11, Math.PI, 0, false);
      c.stroke();

      // Cuerda interior de la bolsa con topes circulares
      c.beginPath();
      c.arc(-26, -10, 9, 0, Math.PI, false);
      c.stroke();
      c.beginPath();
      c.arc(-35, -10, 2.5, 0, Math.PI * 2);
      c.arc(-17, -10, 2.5, 0, Math.PI * 2);
      c.fill();

      // Caja de regalo (derecha, ligeramente superpuesta)
      c.beginPath();
      c.rect(2, -2, 34, 28);
      c.stroke();

      // Tapa de la caja
      c.beginPath();
      c.rect(-1, -10, 40, 8);
      c.stroke();

      // Cintas cruzadas
      c.beginPath();
      c.moveTo(19, -10);
      c.lineTo(19, 26);
      c.moveTo(2, 12);
      c.lineTo(36, 12);
      c.stroke();

      // Moño superior del regalo
      c.beginPath();
      c.ellipse(13, -15, 7, 4, -0.35, 0, Math.PI * 2);
      c.stroke();
      c.beginPath();
      c.ellipse(25, -15, 7, 4, 0.35, 0, Math.PI * 2);
      c.stroke();

      c.restore();
    }

    function drawThreeFacesGraphic(c, yOffset, bgColor) {
      c.save();
      c.translate(0, yOffset);
      c.strokeStyle = '#ffffff';
      c.fillStyle = '#ffffff';
      c.lineWidth = 3.8;
      c.lineCap = 'round';

      // Carita izquierda (seria)
      c.beginPath();
      c.arc(-40, -10, 21, 0, Math.PI * 2);
      c.stroke();
      c.beginPath();
      c.arc(-47, -15, 2.8, 0, Math.PI * 2);
      c.arc(-33, -15, 2.8, 0, Math.PI * 2);
      c.fill();
      c.beginPath();
      c.moveTo(-47, -3);
      c.lineTo(-33, -3);
      c.stroke();

      // Carita derecha (triste)
      c.beginPath();
      c.arc(40, -10, 21, 0, Math.PI * 2);
      c.stroke();
      c.beginPath();
      c.arc(33, -15, 2.8, 0, Math.PI * 2);
      c.arc(47, -15, 2.8, 0, Math.PI * 2);
      c.fill();
      c.beginPath();
      c.arc(40, 2, 8, Math.PI * 1.15, Math.PI * 1.85, false);
      c.stroke();

      // Carita central grande (feliz, superpuesta al frente)
      c.beginPath();
      c.arc(0, 8, 29, 0, Math.PI * 2);
      c.fillStyle = bgColor;
      c.fill();
      c.stroke();

      c.fillStyle = '#ffffff';
      c.beginPath();
      c.arc(-10, 1, 3.5, 0, Math.PI * 2);
      c.arc(10, 1, 3.5, 0, Math.PI * 2);
      c.fill();

      // Sonrisa gruesa abierta
      c.lineWidth = 5;
      c.beginPath();
      c.arc(0, 10, 11, 0.15 * Math.PI, 0.85 * Math.PI, false);
      c.stroke();

      c.restore();
    }

    function drawSpinAgainGraphic(c, yOffset) {
      c.save();
      c.translate(0, yOffset);
      c.strokeStyle = '#ffffff';
      c.lineWidth = 4.2;
      c.lineCap = 'round';
      c.lineJoin = 'round';

      const r = 34;
      // Flecha curva superior
      c.beginPath();
      c.arc(0, 0, r, -Math.PI * 0.82, -Math.PI * 0.18, false);
      c.stroke();
      c.beginPath();
      c.moveTo(22, -26);
      c.lineTo(32, -14);
      c.lineTo(17, -12);
      c.stroke();

      // Flecha curva inferior
      c.beginPath();
      c.arc(0, 0, r, Math.PI * 0.18, Math.PI * 0.82, false);
      c.stroke();
      c.beginPath();
      c.moveTo(-22, 26);
      c.lineTo(-32, 14);
      c.lineTo(-17, 12);
      c.stroke();

      c.restore();
    }

    function drawFivePercentGraphic(c, yOffset) {
      c.save();
      c.translate(0, yOffset);
      c.fillStyle = '#ffffff';
      c.textAlign = 'center';
      c.textBaseline = 'middle';

      // Gran número 5 blanco como en la imagen
      c.font = '900 94px Montserrat, sans-serif';
      c.fillText('5', -14, 0);

      // % OFF al costado derecho del 5
      c.font = '800 17px Montserrat, sans-serif';
      c.fillText('% OFF', 32, 4);

      c.restore();
    }

    function renderWheel() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const outerRadius = Math.min(cx, cy) - 10;
      const innerColorRadius = outerRadius - 30; // Ancho del borde perimetral oscuro (#303d44)

      ctx.clearRect(0, 0, w, h);

      // 1. Fondo circular completo del borde exterior oscuro (#303d44)
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, outerRadius, 0, 2 * Math.PI);
      ctx.fillStyle = '#303d44';
      ctx.fill();
      ctx.restore();

      // 2. Dibujar cada uno de los 9 sectores exactos
      for (let i = 0; i < NUM_SECTORS; i++) {
        const sector = EXACT_9_SECTORS[i];
        // A currentRotation = 0, el sector 0 empieza exactamente a las 12:00 (-PI/2)
        const startAngle = currentRotation + i * ARC_ANGLE - Math.PI / 2;
        const endAngle = startAngle + ARC_ANGLE;

        // En la imagen original, los sectores celestes (#3b96c4) y grises claros (#adb8c6) llegan hasta innerColorRadius
        // dejando el borde exterior oscuro (#303d44), excepto donde se indique
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, innerColorRadius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = sector.bg;
        ctx.fill();
        ctx.restore();

        // Dibujar textos e íconos dentro del sector
        ctx.save();
        ctx.translate(cx, cy);
        const midAngle = startAngle + ARC_ANGLE / 2;
        ctx.rotate(midAngle);

        const radiusCenter = innerColorRadius * 0.61;
        ctx.translate(radiusCenter, 0);

        // Si orientation === 'inward', la parte superior del texto mira hacia el centro (rotación -PI/2)
        // Si orientation === 'outward', la parte superior del texto mira hacia el borde exterior (rotación +PI/2)
        if (sector.orientation === 'inward') {
          ctx.rotate(-Math.PI / 2);
        } else {
          ctx.rotate(Math.PI / 2);
        }

        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#ffffff';
        ctx.textAlign = 'center';

        if (sector.type === 'discount') {
          //En los sectores 5% OFF, el 5 grande va más cerca del centro y el texto más hacia el borde
          if (sector.orientation === 'inward') {
            drawFivePercentGraphic(ctx, -28);
            ctx.font = '700 20px Montserrat, sans-serif';
            ctx.fillText('en el total', 0, 34);
            ctx.fillText('de tu boleta', 0, 56);
          } else {
            drawFivePercentGraphic(ctx, -28);
            ctx.font = '700 20px Montserrat, sans-serif';
            ctx.fillText('en el total', 0, 34);
            ctx.fillText('de tu boleta', 0, 56);
          }
        } else if (sector.type === 'faces') {
          if (sector.orientation === 'inward') {
            drawThreeFacesGraphic(ctx, -24, sector.bg);
            ctx.font = '700 20px Montserrat, sans-serif';
            ctx.fillText('Siga', 0, 34);
            ctx.fillText('participando', 0, 56);
          } else {
            drawThreeFacesGraphic(ctx, -24, sector.bg);
            ctx.font = '700 20px Montserrat, sans-serif';
            ctx.fillText('Siga', 0, 34);
            ctx.fillText('participando', 0, 56);
          }
        } else if (sector.type === 'gift') {
          drawGiftBagGraphic(ctx, -28);
          ctx.font = '700 21px Montserrat, sans-serif';
          ctx.fillText('Regalo', 0, 26);
          ctx.font = '900 42px Cinzel, serif';
          ctx.fillText('CIC', 0, 64);
        } else if (sector.type === 'spin_again') {
          drawSpinAgainGraphic(ctx, -24);
          ctx.font = '700 20px Montserrat, sans-serif';
          ctx.fillText('Gira de', 0, 36);
          ctx.fillText('nuevo', 0, 58);
        }

        ctx.restore();
      }

      // 3. Línea blanca circular continua cerca del borde (exactamente como en la imagen enviada, sin puntos)
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, innerColorRadius - 18, 0, 2 * Math.PI);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3.5;
      ctx.stroke();
      ctx.restore();
    }

    function getSelectedSectorIndex() {
      // La aguja está a las 12:00 (-PI/2). Como el sector 0 comienza en -PI/2 cuando currentRotation = 0:
      const normalized = ((-currentRotation % (2 * Math.PI)) + (2 * Math.PI)) % (2 * Math.PI);
      return Math.floor(normalized / ARC_ANGLE) % NUM_SECTORS;
    }

    /* =====================================================================
       MECÁNICAS DE FÍSICA E INTERACCIÓN AVANZADA (SWIPE & MEDIDOR DE CARGA)
       ===================================================================== */
    function checkTick() {
      const currentIdx = getSelectedSectorIndex();
      if (currentIdx !== lastSectorIndex) {
        lastSectorIndex = currentIdx;
        playTickSound();
        const flapper = document.getElementById('flapperPin');
        if (flapper) {
          flapper.classList.remove('indicator-kick');
          void flapper.offsetWidth;
          flapper.classList.add('indicator-kick');
        }
      }
    }

    function physicsLoop() {
      if (isDragging || isCharging) return;
      if (!isSpinning && Math.abs(angularVelocity) < 0.001) return;

      currentRotation += angularVelocity;
      angularVelocity *= friction;
      
      renderWheel();
      checkTick();

      if (Math.abs(angularVelocity) < 0.0014) {
        isSpinning = false;
        angularVelocity = 0;
        const finalSectorIdx = getSelectedSectorIndex();
        handleResult(EXACT_9_SECTORS[finalSectorIdx]);
        return;
      }
      
      requestAnimationFrame(physicsLoop);
    }

    /* === Lógica de Arrastre (Swipe) en el Canvas === */
    function getPointerAngle(evt) {
      const rect = canvas.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
      return Math.atan2(clientY - cy, clientX - cx);
    }

    function onDragStart(e) {
      e.preventDefault();
      getAudioContext();
      if (isCharging || (isSpinning && Math.abs(angularVelocity) > 0.15)) return;
      
      isDragging = true;
      isSpinning = false;
      angularVelocity = 0;
      
      const angle = getPointerAngle(e);
      dragStartAngle = angle - currentRotation;
      lastDragAngle = angle;
      
      canvas.classList.replace('cursor-grab', 'cursor-grabbing');
    }

    function onDragMove(e) {
      if (!isDragging) return;
      e.preventDefault();
      
      const angle = getPointerAngle(e);
      let newRotation = angle - dragStartAngle;
      
      let delta = angle - lastDragAngle;
      while (delta > Math.PI) delta -= Math.PI * 2;
      while (delta < -Math.PI) delta += Math.PI * 2;
      
      angularVelocity = delta;
      currentRotation = newRotation;
      lastDragAngle = angle;
      
      renderWheel();
      checkTick();
    }

    function onDragEnd() {
      if (!isDragging) return;
      isDragging = false;
      canvas.classList.replace('cursor-grabbing', 'cursor-grab');
      
      if (Math.abs(angularVelocity) > 0.015) {
        isSpinning = true;
        // Amplificar ligeramente el impulso táctil para que sea cómodo en pantalla grande
        angularVelocity = Math.sign(angularVelocity) * Math.min(Math.abs(angularVelocity) * 1.45, 0.95);
        requestAnimationFrame(physicsLoop);
      }
    }

    /* === Lógica de Carga con Medidor Visual de Intensidad (0% a 100%) === */
    const RING_CIRCUMFERENCE = 351.86; // 2 * PI * 56

    function updatePowerUI(powerRatio) {
      const ring = document.getElementById('powerRingCircle');
      const badge = document.getElementById('chargeBadge');
      const textInd = document.getElementById('chargeTextIndicator');
      const btn = document.getElementById('centerLogoBtn');

      const pct = Math.round(powerRatio * 100);
      const offset = RING_CIRCUMFERENCE - (powerRatio * RING_CIRCUMFERENCE);
      ring.style.strokeDashoffset = offset;

      // Color progresivo: Celeste CIC -> Ámbar -> Rojo Potencia Máxima
      let colorHex = '#3b96c4';
      if (pct >= 85) {
        colorHex = '#ef4444'; // Rojo intenso
      } else if (pct >= 45) {
        colorHex = '#f59e0b'; // Naranja/Ámbar
      }

      ring.style.stroke = colorHex;
      badge.style.backgroundColor = colorHex;
      textInd.textContent = `FUERZA: ${pct}%`;

      if (pct >= 95) {
        btn.classList.add('max-power-shake');
      } else {
        btn.classList.remove('max-power-shake');
        btn.style.transform = `translate(-50%, -50%) scale(${1 + powerRatio * 0.06})`;
      }
      btn.style.boxShadow = `0 0 ${25 + powerRatio * 55}px ${powerRatio * 22}px ${colorHex}88`;
    }

    function resetPowerUI() {
      const ring = document.getElementById('powerRingCircle');
      const badge = document.getElementById('chargeBadge');
      const textInd = document.getElementById('chargeTextIndicator');
      const btn = document.getElementById('centerLogoBtn');

      ring.style.strokeDashoffset = RING_CIRCUMFERENCE;
      ring.style.stroke = '#3b96c4';
      badge.style.backgroundColor = '#3b96c4';
      textInd.textContent = 'MANTÉN PRESIONADO';
      btn.classList.remove('max-power-shake');
      btn.style.transform = 'translate(-50%, -50%) scale(1)';
      btn.style.boxShadow = '';
    }

    function startCharge(e) {
      e.preventDefault();
      e.stopPropagation();
      getAudioContext();
      if (isSpinning || isDragging) return;

      isCharging = true;
      chargeStartTime = performance.now();
      lastChargeStepSound = -1;

      animateCharge();
    }

    function animateCharge() {
      if (!isCharging) return;
      const now = performance.now();
      const elapsed = now - chargeStartTime;
      // Oscilación suave si mantiene presionado después del 100% para hacerlo más dinámico
      let rawRatio = elapsed / maxChargeDuration;
      let power = rawRatio <= 1 ? rawRatio : 1 - Math.abs(((rawRatio - 1) % 0.4) - 0.2);
      power = Math.max(0.05, Math.min(1.0, power));

      updatePowerUI(power);

      // Emitir pulso sonoro ascendente cada 10% de carga
      const step = Math.floor(power * 12);
      if (step !== lastChargeStepSound) {
        lastChargeStepSound = step;
        playChargePulseSound(power);
      }
      
      requestAnimationFrame(animateCharge);
    }

    function endCharge(e) {
      if (!isCharging) return;
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      isCharging = false;

      const now = performance.now();
      const elapsed = now - chargeStartTime;
      let power = Math.min(elapsed / maxChargeDuration, 1.0);
      // Si el usuario sólo hizo un toque rápido ("tap"), igual le damos un giro base de cortesía
      if (power < 0.12) power = 0.35;

      resetPowerUI();

      isSpinning = true;
      angularVelocity = 0.22 + (power * 0.72) + (Math.random() * 0.08);
      requestAnimationFrame(physicsLoop);
    }

    // =====================================================================
    // PRESENTACIÓN DEL RESULTADO Y CELEBRACIÓN (CON ICONOS SVG NATIVOS)
    // =====================================================================
    function handleResult(sector) {
      const modal = document.getElementById('prizeModal');
      const box = document.getElementById('modalBox');
      const headerEl = document.getElementById('modalHeader');
      const titleEl = document.getElementById('modalTitle');
      const descEl = document.getElementById('modalDesc');
      const iconContainer = document.getElementById('modalIconContainer');

      headerEl.textContent = sector.header;
      titleEl.textContent = sector.titleModal;
      descEl.textContent = sector.detail;

      if (sector.isWin) {
        iconContainer.innerHTML = `
          <svg class="w-12 h-12 text-[#3b96c4]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="7"></circle>
            <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
          </svg>`;
        playWinSound();
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 95,
            spread: 80,
            origin: { y: 0.6 }
          });
        }
      } else if (sector.isSpinAgain) {
        iconContainer.innerHTML = `
          <svg class="w-12 h-12 text-[#3b96c4]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>`;
        playWinSound();
      } else {
        iconContainer.innerHTML = `
          <svg class="w-12 h-12 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
            <line x1="9" y1="9" x2="9.01" y2="9"></line>
            <line x1="15" y1="9" x2="15.01" y2="9"></line>
          </svg>`;
        playNeutralSound();
      }

      safeRenderIcons();

      modal.classList.remove('hidden');
      setTimeout(() => {
        box.classList.remove('scale-95', 'opacity-0');
        box.classList.add('scale-100', 'opacity-100');
      }, 30);
    }

    function closePrizeModal() {
      const modal = document.getElementById('prizeModal');
      const box = document.getElementById('modalBox');
      box.classList.remove('scale-100', 'opacity-100');
      box.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 200);
      
      isSpinning = false;
      angularVelocity = 0;
    }

    // CONTROLES DE PANTALLA COMPLETA Y SONIDO
    document.getElementById('soundToggleBtn')?.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('soundOnSvg')?.classList.toggle('hidden', !soundEnabled);
      document.getElementById('soundOffSvg')?.classList.toggle('hidden', soundEnabled);
    });

    document.getElementById('fullscreenBtn')?.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // INICIALIZACIÓN Y EVENT LISTENERS TÁCTILES
    window.onload = function() {
      safeRenderIcons();
      renderWheel();

      // Configurar Swipe en el Canvas
      canvas.addEventListener('mousedown', onDragStart);
      window.addEventListener('mousemove', onDragMove);
      window.addEventListener('mouseup', onDragEnd);

      canvas.addEventListener('touchstart', onDragStart, {passive: false});
      window.addEventListener('touchmove', onDragMove, {passive: false});
      window.addEventListener('touchend', onDragEnd);

      // Configurar Hold to Charge en el Botón Central
      const centerBtn = document.getElementById('centerLogoBtn');
      centerBtn.addEventListener('mousedown', startCharge);
      window.addEventListener('mouseup', endCharge);
      
      centerBtn.addEventListener('touchstart', startCharge, {passive: false});
      window.addEventListener('touchend', endCharge);
    };

    window.addEventListener('resize', () => {
      renderWheel();
    });
  </script>
</body>
