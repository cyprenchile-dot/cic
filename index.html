<html lang="es">
<head>

        body, html {
            margin: 0;

            width: 100%;

            color: white;
            overflow: hidden; /* Evita cualquier barra de desplazamiento */
            touch-action: none;
        }
        
        /* El título queda flotando arriba para no empujar la ruleta */
        .header {
            position: absolute;
            top: 4%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
            z-index: 10;
        }
        
        .header h1 {
            font-size: clamp(1.8rem, 5vh, 4rem);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .header p {
            font-size: clamp(1rem, 2.5vh, 1.5rem);
            margin: 5px 0 0 0;
            background-color: #007bb5;
            padding: 5px 20px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

            align-items: center;
        }
