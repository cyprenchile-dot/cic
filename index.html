<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruleta CIC - 114 Años</title>
    <!-- Librería para el Confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1c2331;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
            touch-action: none;
        }
        
        .header {
            position: absolute;
            top: 4%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
            z-index: 10;
        }
        
        .header h1 {
            font-size: clamp(1.8rem, 5vh, 4rem);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .header p {
            font-size: clamp(1rem, 2.5vh, 1.5rem);
            margin: 5px 0 0 0;
            background-color: #007bb5;
            padding: 5px 20px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-transform: uppercase;
            font-weight: bold;
        }
        
        .wheel-container {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: min(90vw, 70vh); 
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        
        .pointer-container {
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(50px, 8vw, 80px);
            height: clamp(75px, 12vw, 120px);
            z-index: 20;
            filter: drop-shadow(0 6px 6px rgba(0,0,0,0.6));
        }
        
        /* BOTÓN CENTRAL: Ahora contendrá un gráfico vectorial perfecto */
        .center-logo {
            position: absolute;
            width: 32%;
            height: 32%;
            border-radius: 50%;
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.1s;
            background-color: white;
        }

        .center-logo:active {
            transform: scale(0.95);
        }
        
        .fullscreen-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
            transition: 0.3s;
        }

        /* MODAL DEL GANADOR */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(28, 35, 49, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            background: white;
            color: #1c2331;
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 80%;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal h2 { 
            font-size: clamp(1.5rem, 4vw, 3rem); 
            margin: 20px 0; 
            color: #007bb5; 
            text-transform: uppercase; 
        }

        .modal button {
            padding: 15px 40px;
            font-size: 1.5rem;
            background: #007bb5;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .modal button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="header">
        <h1>¡Gira y Gana!</h1>
        <p>Descubre tu premio</p>
    </div>

    <div class="wheel-container">
        <!-- PUNTERO ORIGINAL -->
        <div class="pointer-container">
            <svg viewBox="0 0 100 150" width="100%" height="100%">
                <circle cx="50" cy="30" r="15" fill="transparent" stroke="white" stroke-width="8"/>
                <path d="M 25 45 L 75 45 L 50 110 Z" fill="transparent" stroke="white" stroke-width="8" stroke-linejoin="round"/>
            </svg>
        </div>
        
        <canvas id="wheelCanvas" width="1000" height="1000"></canvas>
        
        <!-- LOGO CENTRAL EN SVG (Proporción perfecta e inalterable) -->
        <div class="center-logo" id="spinButton">
            <svg viewBox="0 0 200 200" width="100%" height="100%">
                <!-- CIC -->
                <text x="96" y="98" font-family="Georgia, serif" font-size="58" font-weight="900" fill="#1c2331" text-anchor="end" letter-spacing="-2">CIC</text>
                <!-- 114 AÑOS -->
                <text x="100" y="70" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#1c2331" text-anchor="start">114</text>
                <text x="100" y="95" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#1c2331" text-anchor="start">AÑOS</text>
                <!-- MEJORANDO EL DESCANSO -->
                <text x="100" y="122" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#1c2331" text-anchor="middle" letter-spacing="0.5">MEJORANDO EL DESCANSO</text>
                <!-- MANTÉN PRESIONADO -->
                <rect x="40" y="135" width="120" height="26" rx="13" fill="#4fb2d9" />
                <text x="100" y="153" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">MANTÉN PRESIONADO</text>
            </svg>
        </div>
    </div>
    
    <button class="fullscreen-btn" onclick="toggleFullScreen()">⛶ Pantalla Completa</button>

    <!-- VENTANA EMERGENTE DE GANADOR -->
    <div id="winnerModal" class="modal">
        <div class="modal-content">
            <div id="prizeIcon" style="font-size: 6rem; margin-bottom: 10px;">🎁</div>
            <h2 id="prizeText">Premio</h2>
            <button onclick="closeModal()">Continuar</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinButton = document.getElementById('spinButton');
        const sliceAngle = (2 * Math.PI) / 6;
        
        // PREMIOS DE TU IMAGEN ORIGINAL
        const prizes = [
            { text: "Siga\nparticipando", color: "#4fb2d9", icon: "😔" },
            { text: "Regalo\nCIC", color: "#324451", icon: "🎁" },
            { text: "Gira\nde nuevo", color: "#c1c6c8", icon: "🔄" },
            { text: "Siga\nparticipando", color: "#4fb2d9", icon: "😔" },
            { text: "Regalo\nCIC", color: "#324451", icon: "🎁" },
            { text: "Siga\nparticipando", color: "#c1c6c8", icon: "😔" }
        ];

        let currentAngle = 0;
        let isSpinning = false;
        let spinVelocity = 0;
        const friction = 0.985;
        let lastTick = 0;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTick() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playWinSound() {
            if (!audioCtx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50]; 
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.value = freq;
                const startTime = audioCtx.currentTime + index * 0.1;
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.5, startTime + 0.05);
                gain.gain.linearRampToValueAtTime(0, startTime + 0.4);
                osc.start(startTime);
                osc.stop(startTime + 0.4);
            });
        }
        
        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < prizes.length; i++) {
                const startAngle = currentAngle + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = prizes[i].color;
                ctx.fill();
                ctx.lineWidth = 6;
                ctx.strokeStyle = "#ffffff";
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = (prizes[i].color === "#c1c6c8") ? "#1c2331" : "#ffffff";
                
                ctx.font = "bold 50px Arial";
                ctx.fillText(prizes[i].icon, radius - 40, 18);
                
                ctx.font = "bold 32px Arial";
                const lines = prizes[i].text.split('\n');
                if (lines.length > 1) {
                    ctx.fillText(lines[0], radius - 120, -5);
                    ctx.fillText(lines[1], radius - 120, 35);
                } else {
                    ctx.fillText(lines[0], radius - 120, 15);
                }
                ctx.restore();
            }
        }

        function animate() {
            if (isSpinning) {
                currentAngle += spinVelocity;
                spinVelocity *= friction;

                let currentTick = Math.floor(currentAngle / sliceAngle);
                if (currentTick !== lastTick) {
                    playTick();
                    lastTick = currentTick;
                }

                if (spinVelocity < 0.002) {
                    isSpinning = false;
                    spinVelocity = 0;
                    
                    let offsetAngle = (1.5 * Math.PI - currentAngle) % (2 * Math.PI);
                    if (offsetAngle < 0) offsetAngle += 2 * Math.PI;
                    const winningIndex = Math.floor(offsetAngle / sliceAngle);
                    const prize = prizes[winningIndex];

                    showWinner(prize);
                }
                drawWheel();
                requestAnimationFrame(animate);
            }
        }

        function showWinner(prize) {
            playWinSound();
            
            confetti({
                particleCount: 250,
                spread: 100,
                origin: { y: 0.6 },
                zIndex: 2000,
                colors: ['#007bb5', '#ffffff', '#4fb2d9', '#c1c6c8']
            });
            
            let winText = prize.text.replace('\n', ' ');
            document.getElementById('prizeIcon').innerText = prize.icon;
            document.getElementById('prizeText').innerText = winText;
            
            setTimeout(() => {
                document.getElementById('winnerModal').style.display = 'flex';
            }, 600);
        }

        function closeModal() {
            document.getElementById('winnerModal').style.display = 'none';
        }

        spinButton.addEventListener('click', () => {
            if (!isSpinning) {
                initAudio(); 
                spinVelocity = Math.random() * 0.2 + 0.3; 
                isSpinning = true;
                animate();
            }
        });

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        drawWheel();
    </script>
</body>
</html>
